name: Refresh statistical snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8,20 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh snapshots
        run: python pipelines/refresh_snapshots.py
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
